octomap_frame_id: odom
octomap_resolution: 0.05

sensors:
  - head_kinect_cloud

head_kinect_cloud:
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
  point_cloud_topic: /hardware/camera/points
  max_range: 4.0
  padding_offset: 0.03
  padding_scale: 1.0
  point_subsample: 1
  filtered_cloud_topic: octomap_filtered_cloud
  max_update_rate: 1.0
