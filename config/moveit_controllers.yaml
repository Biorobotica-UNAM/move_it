# MoveIt uses this configuration for controller management

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - left_arm_controller
    - right_arm_controller
    - torso_controller

  left_arm_controller:
    type: FollowJointTrajectory
    joints:
      - lf_shoulder_joint
      - ls_shoulder_joint
      - l_arm_twist_joint
      - l_elbow_joint
      - l_wrist_joint
      - l_hand_joint
    action_ns: follow_joint_trajectory
    default: true
  right_arm_controller:
    type: FollowJointTrajectory
    joints:
      - rf_shoulder_joint
      - rs_shoulder_joint
      - r_arm_twist_joint
      - r_elbow_joint
      - r_wrist_joint
      - r_hand_joint
    action_ns: follow_joint_trajectory
    default: true
  torso_controller:
    type: FollowJointTrajectory
    joints:
      - torso_joint
    action_ns: follow_joint_trajectory
    default: true